<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - Focus Infraestrutura</title>
    
    <!-- 🔥 CAMINHOS ABSOLUTOS: Funcionam na raiz e em subpastas do blog -->
    <link rel="stylesheet" href="/assets/css/header.css">
    <link rel="stylesheet" href="/assets/css/footer.css">
    
    <!-- Scripts dos componentes do Header e Footer -->
    <script src="/assets/js/header-component.js" defer></script>
    <script src="/assets/js/footer-component.js" defer></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f8fafc;
            color: #334155;
            padding-top: 80px; /* Garante que o header fixo não cubra o título do artigo */
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* --- Estilização do Artigo --- */
        .post-container {
            flex: 1;
            max-width: 800px; /* Largura confortável para leitura */
            margin: 0 auto;
            padding: 60px 20px;
            width: 100%;
        }

        .post-header {
            margin-bottom: 40px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 20px;
        }

        .post-meta {
            font-size: 14px;
            color: #800020; /* Vermelho Escuro */
            font-weight: 600;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .post-header h1 {
            font-size: 36px;
            color: #0f172a;
            font-weight: 800;
            line-height: 1.3;
        }

        /* --- Conteúdo do Markdown --- */
        .post-content {
            font-size: 18px;
            line-height: 1.8;
            color: #334155;
        }

        .post-content p {
            margin-bottom: 25px;
            text-align: justify;
        }

        .post-content h2, .post-content h3 {
            color: #0f172a;
            margin: 40px 0 20px 0;
            font-weight: 700;
        }

        .post-content h2 { font-size: 26px; }
        .post-content h3 { font-size: 22px; }

        .post-content ul, .post-content ol {
            margin-bottom: 25px;
            padding-left: 25px;
        }

        .post-content li {
            margin-bottom: 10px;
        }

        .post-content img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 30px auto;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
        }

        /* Estilização básica para tabelas geradas no Markdown */
        .post-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 30px 0;
            font-size: 16px;
        }

        .post-content th, .post-content td {
            padding: 12px 15px;
            border: 1px solid #e2e8f0;
            text-align: left;
        }

        .post-content th {
            background-color: #f1f5f9;
            color: #0f172a;
            font-weight: 700;
        }

        .post-content blockquote {
            border-left: 4px solid #800020;
            padding-left: 20px;
            margin: 30px 0;
            font-style: italic;
            color: #475569;
            background-color: #f8fafc;
            padding-top: 10px;
            padding-bottom: 10px;
        }

        .btn-voltar {
            display: inline-flex;
            align-items: center;
            margin-top: 40px;
            color: #800020;
            text-decoration: none;
            font-weight: 700;
            gap: 8px;
        }

        .btn-voltar:hover {
            color: #ba183d;
        }

        @media (max-width: 640px) {
            .post-header h1 { font-size: 28px; }
            .post-content { font-size: 16px; }
        }
    </style>
</head>
<body>

    <!-- Header injetado via Web Component -->
    <custom-header></custom-header>

    <main class="post-container">
        <article>
            <header class="post-header">
                <div class="post-meta">Publicado em {{ date | date: "%d/%m/%Y" }}</div>
                <h1>{{ title }}</h1>
            </header>
            
            <div class="post-content">
                {{ content }}
            </div>
            
            <a href="/noticias/" class="btn-voltar">&larr; Voltar para Notícias</a>
        </article>
    </main>

    <!-- 🔥 Utilização do Web Component do Footer para manter a consistência com o restante do site -->
    <custom-footer></custom-footer>

</body>
</html>
